apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-web-deployment
  labels:
    app: main-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-web
  template:
    metadata:
      labels:
        app: main-web
    spec:
      containers:
      - name: web
        image: sonalkawale/main-web:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi


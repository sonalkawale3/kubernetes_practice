apiVersion: v1
kind: Service
metadata:
  name: main-web-svc
  labels:
    app: main-web
spec:
  type: ClusterIP
  selector:
    app: main-web
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80

